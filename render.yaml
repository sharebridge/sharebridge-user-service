# Render Blueprint — one Web Service. Full guide:
# https://github.com/sharingbridge/sharingbridge/blob/main/configuration/backend-render.md
services:
  - type: web
    name: sharingbridge-user-service
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: AUTH_TOKEN_ISSUER
        value: sharingbridge-user-service
      - key: AUTH_TOKEN_AUDIENCE
        value: sharingbridge-clients
      - key: AUTH_TOKEN_TTL_SECONDS
        value: "3600"
      - key: WEB_CORS_ORIGINS
        sync: false
